<body class="bg-background text-on-background antialiased min-h-screen flex flex-col justify-center items-center p-container_margin">
<div class="w-full max-w-md bg-surface-container-lowest rounded-[24px] shadow-[0_8px_32px_rgba(79,70,225,0.06),_0_2px_8px_rgba(0,0,0,0.04)] border border-surface-variant overflow-hidden relative">
<!-- AI Magic Glow (Decorative) -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-gradient-to-br from-primary/10 to-transparent rounded-full blur-3xl pointer-events-none"></div>
<div class="p-8 relative z-10">
<!-- Brand Logo Area -->
<div class="flex flex-col items-center mb-8">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center mb-stack_sm shadow-[inset_0_2px_4px_rgba(255,255,255,0.3)]">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
<h1 class="font-h2 text-h2 text-on-background text-center">Smart Manager</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center mt-unit">Insightful business management.</p>
</div>
<!-- Tabs (Login/Register) -->
<div class="flex border-b border-surface-variant mb-6">
<button class="flex-1 pb-3 text-center border-b-2 border-primary text-primary font-insight-text text-insight-text">Sign In</button>
<button class="flex-1 pb-3 text-center border-b-2 border-transparent text-on-surface-variant font-insight-text text-insight-text hover:text-primary transition-colors">Create Account</button>
</div>
<!-- Form Form -->
<form class="space-y-stack_md">
<!-- Email Input -->
<div class="space-y-unit">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm placeholder:text-outline/70" id="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-unit">
<div class="flex justify-between items-center">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all font-body-sm text-body-sm placeholder:text-outline/70" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-background" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full py-3 px-4 bg-primary text-on-primary rounded-xl font-insight-text text-insight-text shadow-[inset_0_1px_0_rgba(255,255,255,0.2),_0_2px_4px_rgba(79,70,225,0.2)] hover:bg-primary-fixed-variant transition-colors flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-6">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label-caps text-label-caps uppercase">Or continue with</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-surface rounded-xl border border-outline-variant hover:bg-surface-variant transition-colors font-insight-text text-insight-text text-on-background">
